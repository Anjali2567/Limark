databaseChangeLog:
  logicalFilePath: db/changelog/002-indexes.yaml
  changeSet:
    - id: 002-create-performance-indexes
      author: migration
      changes:
        # Tenant indexes
        - createIndex:
            indexName: idx_tenants_name
            tableName: tenants
            columns:
              - column:
                  name: name

        # Workspace indexes
        - createIndex:
            indexName: idx_workspaces_tenant_id
            tableName: workspaces
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            indexName: idx_workspaces_name
            tableName: workspaces
            columns:
              - column:
                  name: name

        # User indexes
        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email
            unique: true
        - createIndex:
            indexName: idx_users_is_active
            tableName: users
            columns:
              - column:
                  name: is_active

        # Lead company indexes
        - createIndex:
            indexName: idx_lead_companies_name
            tableName: lead_companies
            columns:
              - column:
                  name: name
        - createIndex:
            indexName: idx_lead_companies_website
            tableName: lead_companies
            columns:
              - column:
                  name: website
        - createIndex:
            indexName: idx_lead_companies_industry_id
            tableName: lead_companies
            columns:
              - column:
                  name: industry_id

        # Lead contact indexes
        - createIndex:
            indexName: idx_lead_contacts_email
            tableName: lead_contacts
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_lead_contacts_company_id
            tableName: lead_contacts
            columns:
              - column:
                  name: company_id
        - createIndex:
            indexName: idx_lead_contacts_name
            tableName: lead_contacts
            columns:
              - column:
                  name: first_name
              - column:
                  name: last_name

        # Lead list indexes
        - createIndex:
            indexName: idx_lead_lists_workspace_id
            tableName: lead_lists
            columns:
              - column:
                  name: workspace_id
        - createIndex:
            indexName: idx_lead_lists_name
            tableName: lead_lists
            columns:
              - column:
                  name: name

        # Campaign indexes
        - createIndex:
            indexName: idx_campaigns_workspace_id
            tableName: campaigns
            columns:
              - column:
                  name: workspace_id
        - createIndex:
            indexName: idx_campaigns_status
            tableName: campaigns
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_campaigns_created_at
            tableName: campaigns
            columns:
              - column:
                  name: created_at

        # Campaign email indexes
        - createIndex:
            indexName: idx_campaign_emails_campaign_id
            tableName: campaign_emails
            columns:
              - column:
                  name: campaign_id
        - createIndex:
            indexName: idx_campaign_emails_status
            tableName: campaign_emails
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_campaign_emails_recipient
            tableName: campaign_emails
            columns:
              - column:
                  name: recipient_email

        # Vendor indexes
        - createIndex:
            indexName: idx_vendors_name
            tableName: vendors
            columns:
              - column:
                  name: name
        - createIndex:
            indexName: idx_vendors_status
            tableName: vendors
            columns:
              - column:
                  name: status

        # Vendor agreement indexes
        - createIndex:
            indexName: idx_vendor_agreements_vendor_id
            tableName: vendor_agreements
            columns:
              - column:
                  name: vendor_id

        # Workspace user indexes
        - createIndex:
            indexName: idx_workspace_users_workspace_id
            tableName: workspace_users
            columns:
              - column:
                  name: workspace_id
        - createIndex:
            indexName: idx_workspace_users_user_id
            tableName: workspace_users
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_workspace_users_role
            tableName: workspace_users
            columns:
              - column:
                  name: role

        # User activity log indexes
        - createIndex:
            indexName: idx_user_activity_logs_user_id
            tableName: user_activity_logs
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_user_activity_logs_timestamp
            tableName: user_activity_logs
            columns:
              - column:
                  name: timestamp
        - createIndex:
            indexName: idx_user_activity_logs_action
            tableName: user_activity_logs
            columns:
              - column:
                  name: action

        # Lead note indexes
        - createIndex:
            indexName: idx_lead_notes_lead_id
            tableName: lead_notes
            columns:
              - column:
                  name: lead_id

        # Lead query indexes
        - createIndex:
            indexName: idx_lead_queries_workspace_id
            tableName: lead_queries
            columns:
              - column:
                  name: workspace_id

        # Lead search history indexes
        - createIndex:
            indexName: idx_lead_search_histories_user_id
            tableName: lead_search_histories
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_lead_search_histories_created_at
            tableName: lead_search_histories
            columns:
              - column:
                  name: created_at

        # Message indexes
        - createIndex:
            indexName: idx_messages_sender_id
            tableName: messages
            columns:
              - column:
                  name: sender_id
        - createIndex:
            indexName: idx_messages_recipient_id
            tableName: messages
            columns:
              - column:
                  name: recipient_id
        - createIndex:
            indexName: idx_messages_created_at
            tableName: messages
            columns:
              - column:
                  name: created_at

        # Quotation indexes
        - createIndex:
            indexName: idx_quotations_workspace_id
            tableName: quotations
            columns:
              - column:
                  name: workspace_id
        - createIndex:
            indexName: idx_quotations_status
            tableName: quotations
            columns:
              - column:
                  name: status

        # Refresh token indexes
        - createIndex:
            indexName: idx_refresh_tokens_user_id
            tableName: refresh_tokens
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_refresh_tokens_expires_at
            tableName: refresh_tokens
            columns:
              - column:
                  name: expires_at

        # Campaign chat memory indexes
        - createIndex:
            indexName: idx_campaign_chat_memory_campaign_id
            tableName: campaign_chat_memory
            columns:
              - column:
                  name: campaign_id

        # Email sequence template indexes
        - createIndex:
            indexName: idx_email_sequence_templates_workspace_id
            tableName: email_sequence_templates
            columns:
              - column:
                  name: workspace_id

        # Apollo data indexes
        - createIndex:
            indexName: idx_apollo_company_data_company_id
            tableName: apollo_company_data
            columns:
              - column:
                  name: company_id
        - createIndex:
            indexName: idx_apollo_contact_data_contact_id
            tableName: apollo_contact_data
            columns:
              - column:
                  name: contact_id

        # Tenant announcement indexes
        - createIndex:
            indexName: idx_tenant_announcements_tenant_id
            tableName: tenant_announcements
            columns:
              - column:
                  name: tenant_id
