name: Deploy

on:
  push:
    branches:
      - develop
      - main

env:
  SERVICE: leadplus-intelligence
  NAMESPACE: ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'Staging' || 'Development' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Environment Configuration
        run: |
          cat > .env <<EOF
          # Environment Configuration
          NODE_ENV=production

          # Application Configuration
          PORT=3000

          # Database Configuration
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_NAME=${{ vars.DATABASE_NAME }}
          DB_MAX_POOL_SIZE=10
          DB_MIN_POOL_SIZE=2
          DB_CONNECT_TIMEOUT_MS=10000
          DB_SOCKET_TIMEOUT_MS=45000

          # Logging Configuration
          LOG_LEVEL=info
          LOG_DIR=logs

          # Rate Limiting Configuration
          RATE_LIMIT_MAX_REQUESTS=100
          RATE_LIMIT_WINDOW_MS=60000

          # External API Configuration
          EXTERNAL_API_TIMEOUT=30000
          EXTERNAL_API_RETRY_ATTEMPTS=3
          EXTERNAL_API_KEY=${{ secrets.EXTERNAL_API_KEY }}
          EXTERNAL_API_BASE_URL=https://intelligence.leadplus.ai
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm run typecheck

      - name: Build project
        run: pnpm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t ${ECR_REGISTRY}/${SERVICE}-repository/${NAMESPACE}:${IMAGE_TAG} .
          docker push ${ECR_REGISTRY}/${SERVICE}-repository/${NAMESPACE}:${IMAGE_TAG}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --service ${SERVICE}-service-${NAMESPACE} \
            --force-new-deployment \
            --deployment-configuration "minimumHealthyPercent=0,maximumPercent=100"
